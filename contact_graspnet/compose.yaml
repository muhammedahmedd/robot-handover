services:
  contact_graspnet:
    build: .
    image: contact_graspnet
    container_name: contact_graspnet
    command: python /workspace/cgn_worker.py # Automatically start the CGN inference worker

    gpus: all

    environment:
     - DISPLAY=${DISPLAY}
     - MPLBACKEND=Qt5Agg
  
    volumes:
      - ./contact_graspnet:/workspace/contact_graspnet
      - ../shared/cgn:/shared/cgn
      - ./cgn_worker.py:/workspace/cgn_worker.py
      - /tmp/.X11-unix:/tmp/.X11-unix

    stdin_open: true
    tty: true
